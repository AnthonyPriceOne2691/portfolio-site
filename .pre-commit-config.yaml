# pre-commit hooks. Установка: pip install pre-commit && pre-commit install.
# Прогон по всему дереву: pre-commit run --all-files.
#
# Пути ниже — под backend/-и-frontend/-layout (git-root = корень проекта).
# Поправь files:/exclude:/entry: и путь к venv (.venv) под свою структуру.
# Скрипт-хуки читают структуру из env LINT_PY_SRC/LINT_FE_DIR/... (см. §6 документа) —
# задай их здесь ПРЕФИКСОМ или через export, если дефолты не подходят:
#   entry: bash -c 'cd "$(git rev-parse --show-toplevel)" && LINT_PY_SRC=backend/app bash scripts/lint/check_grep_gate.sh --rule config-access'
#   entry: bash -c 'export LINT_PY_SRC=backend/app; cd "$(git rev-parse --show-toplevel)" && bash ...'
# ⚠ Форма `LINT_PY_SRC=... && bash ...` (стояла здесь до cqg@1.28) НЕ работает:
# присваивание без export и с `&&` создаёт переменную ТЕКУЩЕГО шелла, а гейт —
# дочерний процесс, он её не видит. Гейт молча брал дефолт `backend/features`,
# каталога не было, и он печатал мягкий пропуск с exit 0 — зелёный гейт,
# просмотревший ноль файлов. Форма без `bash -c` невозможна в принципе:
# `language: system` делит entry по shlex и делает exec, поэтому `VAR=x` уходит в
# argv[0] и падает FileNotFoundError. Нашло приёмочное развёртывание.

default_install_hook_types: [pre-commit]
fail_fast: false

repos:
  # -------------------------------------------------------------------------
  # 0. Базовая гигиена: конфиги ОБЯЗАНЫ парситься. Без этого сломанный YAML в
  # .github/workflows/ живёт незамеченным: хостинг не кричит, а показывает
  # workflow путём вместо имени и валит прогон (реальный случай 2026-07-28).
  # Косметические хуки (trailing-whitespace, end-of-file-fixer) сознательно НЕ
  # включены: они трогают все существующие файлы не по теме поставки.
  # -------------------------------------------------------------------------
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-yaml
      - id: check-json
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=512]
        # docs/canon/ — СНИМОК канонов (вариант C, §5 шаг 11), а не поставка:
        # CODE_QUALITY_GATES.md один весит 712 КБ. Тот же принцип, по которому
        # каталог уже исключён из breaker'ов (Delivery §3.4) и из ruff. Без этой
        # строки развёртывание варианта C роняет собственный коммит — найдено
        # исполнением, а не чтением: §5 шаг 11 про этот хук не предупреждает.
        exclude: ^docs/canon/

  # -------------------------------------------------------------------------
  # Python: ruff (lint + format) — под backend.
  # -------------------------------------------------------------------------
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.13
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
        files: ^backend/
      - id: ruff-format
        files: ^backend/
  # -------------------------------------------------------------------------
  # TypeScript / React: ESLint (per-file errors) + warning-ратчет + Prettier.
  # -------------------------------------------------------------------------
  - repo: local
    hooks:
      - id: eslint
        name: ESLint (TypeScript + Astro) — вне снимка ошибок
        language: system
        # ⚠ `types_or` про `.astro` НЕ знает — pre-commit такого типа не имеет,
        # поэтому отбор только регуляркой. С прежним `types_or: [ts, tsx]` весь
        # код проекта проходил мимо линтера, а гейт печатал «просмотрено 1 файл»
        # и выглядел работающим (долг прошлой поставки, cqg@1.91).
        files: ^src/.*\.(ts|tsx|mts|astro)$
        # Файлы, стоящие в снимке ошибок, здесь ПРОПУСКАЮТСЯ: их судит ратчет
        # (`eslint-error-ratchet`, только вниз). Иначе два хука противоречили бы
        # друг другу — ратчет разрешает легаси-долг, а этот валил бы на нём всегда,
        # и для brownfield-фронта не оставалось пути войти (cqg@1.38).
        # Здесь остаётся то, что ратчет и требует: файл ВНЕ снимка обязан быть чист.
        entry: bash -c 'cd "$(git rev-parse --show-toplevel)"; b=scripts/lint/eslint_warnings_baseline.txt; files=(); for f in "$@"; do grep -qE "^[0-9]+:${f}\$" "$b" 2>/dev/null || files+=("$f"); done; [ ${#files[@]} -eq 0 ] && exit 0; npx --no-install eslint "${files[@]}"' --
        pass_filenames: true

      - id: eslint-warning-ratchet
        name: ESLint warnings — рост запрещён (count-ratchet)
        language: system
        entry: bash -c 'cd "$(git rev-parse --show-toplevel)" && LINT_FE_DIR=. bash scripts/lint/check_eslint_warnings.sh'
        files: ^src/.*\.(ts|tsx|astro)$
        pass_filenames: false

      - id: prettier
        name: Prettier (Astro / TS / CSS / JSON / MD)
        language: system
        # Та же причина, что у eslint выше: `.astro` в `types_or` не выразим.
        # Markdown добавлен намеренно — контент проектов это markdown, и без
        # него форматтер не видел бы половину того, что правят чаще всего.
        files: ^src/.*\.(ts|tsx|mts|astro|css|json|md)$
        entry: bash -c 'cd "$(git rev-parse --show-toplevel)" && npx --no-install prettier --check "$@"' --
        pass_filenames: true

  # -------------------------------------------------------------------------
  # Файлы кода: prod <= 500 / tests <= 1000 строк (baseline-ratchet).
  # -------------------------------------------------------------------------
  - repo: local
    hooks:
      - id: file-length
        name: Файлы кода <= 500/1000 строк (baseline-ratchet)
        language: system
        # ⚠ Маска ОБЯЗАНА называть .astro, и это проверено исполнением, а не
        # чтением: с дефолтом `*.py *.ts *.tsx` файл на 900 строк в src/pages/
        # давал «file-length: OK — просмотрено 1 файл(ов)», exit 0. Весь код
        # проекта живёт в .astro, то есть гейт был слеп целиком. `types_or`
        # тоже не знает про .astro — берём files-регуляркой.
        entry: bash -c 'cd "$(git rev-parse --show-toplevel)" && LINT_LENGTH_GLOBS="*.astro *.ts *.tsx *.js *.mjs *.css" bash scripts/lint/check_file_length.sh'
        files: \.(astro|ts|tsx|js|mjs|css)$
        pass_filenames: false

  # -------------------------------------------------------------------------
  # Греп-гейты конвенций (per-file baseline-ratchet).
  # -------------------------------------------------------------------------
  - repo: local
    hooks:
      - id: jscpd-dry-gate
        name: DRY — рост копипаста (jscpd clone-count ratchet)
        language: system
        # cqg@1.76: у гейта появилась TS-половина. LINT_JSCPD_TS_EXTS обязателен —
        # замер: без него `.astro` не считается ВООБЩЕ (1 файл вместо 2).
        entry: bash -c 'cd "$(git rev-parse --show-toplevel)" && LINT_TS_SRC=src LINT_FE_DIR=. LINT_PY_SRC=нет-python LINT_JSCPD_TS_EXTS="typescript:ts,tsx,astro" bash scripts/lint/check_jscpd_gate.sh'
        files: ^(src/.*|\.pre-commit-config\.yaml|scripts/lint/.*)$
        pass_filenames: false

  # -------------------------------------------------------------------------
  # Функции и диагностируемость: сложность на уровне функции (плохой код живёт
  # там, а не в файле) и сообщения ошибок с контекстом (§2.4a).
  # -------------------------------------------------------------------------
  - repo: local
    hooks:
      # ⚠ Значения env живут ЗДЕСЬ, в entry, а не в шелле: `git commit` запускает
      # хук в своём окружении, и без них гейт ушёл бы в дефолт `frontend/src`,
      # которого у этого проекта нет, — «просмотрено 0 файлов» с кодом 0 (§6).
      - id: complexity-gate
        name: "function complexity ratchet (ts: eslint --rule)"
        entry: bash -c 'cd "$(git rev-parse --show-toplevel)" && LINT_TS_SRC=src LINT_FE_DIR=. bash scripts/lint/check_complexity_gate.sh'
        language: system
        files: ^(src/.*\.(ts|mts|js|mjs)|eslint\.config\.js|tsconfig\.json|\.pre-commit-config\.yaml|scripts/lint/.*)$
        pass_filenames: false

      - id: layers-gate
        name: "layers — направление зависимостей (ts: dependency-cruiser)"
        entry: bash -c 'cd "$(git rev-parse --show-toplevel)" && LINT_TS_SRC=src LINT_FE_DIR=. bash scripts/lint/check_layers_gate.sh'
        language: system
        files: ^(src/.*|\.dependency-cruiser\..*|tsconfig\.json|\.pre-commit-config\.yaml|scripts/lint/.*)$
        pass_filenames: false

  # deps-audit и mutation — НЕ на commit (§8.6: бюджет 5 с). deps-audit ходит в
  # сеть, mutation считает минуты. Их место — CI и pre-push.
  - repo: local
    hooks:
      # -----------------------------------------------------------------------
      # Secrets. §2.7 посылала за этим блоком «в конец Приложения B», а блока здесь
      # НЕ БЫЛО — он жил только в прозе §2.7. Кто копировал конфиг дословно (а канон
      # требует именно дословно), получал контур без secrets-хука, при том что
      # строка приёмки §6 «Нет секретов в git» помечена `auto`. Три независимых
      # развёртывания нашли это по отдельности. Альтернатива — gitleaks, см. §2.7.
      # -----------------------------------------------------------------------
      - id: detect-secrets-guard
        name: secrets — ничего секретного в коммит (§2.7)
        language: system
        # entry блочным скаляром `|-`, а НЕ plain: в тексте есть «Установка: pip …»,
        # а последовательность `": "` внутри plain-скаляра YAML запрещена и роняет
        # разбор ВСЕГО файла — pre-commit не стартует ни одним хуком. Именно так и
        # вышло при добавлении этого хука; поймал приёмочный прогон, а не
        # самопроверка, потому что PyYAML на машине правившего не стоял.
        #
        # lab-11 F10: хук печатал `Passed`, не просканировав НИ ОДНОГО файла —
        # голый `command -v` не видел инструмента в venv проекта, а «инструмента
        # нет» выходил нулём. Единственный хук с голым PATH был ровно тот, для
        # которого §6 запрещает soft-режим. Теперь: ① инструмент ищется СНАЧАЛА
        # в venv (как у mypy-соседа), потом в PATH; ② инструмента нет + weak НЕ
        # объявлен в STATUS = exit 1 — наказывается ложь, а не бедность (тот же
        # принцип, что check_ci_status.sh); ③ успех печатает число просмотренных
        # (§6: «чисто» обязано отличаться от «ноль файлов»); ④ нет baseline при
        # живом инструменте = exit 1 с командой снятия.
        #
        # ⚠ Сообщения ниже пишут «secrets — …», а НЕ «secrets: …», и это не стиль.
        # Замер (первое развёртывание, находка 2): detect-secrets на yaml-файле
        # относит находку к строке `entry: |-`, а его KeywordDetector считает
        # секретом всё, что стоит после `secret…:` — то есть текст СВОЕГО ЖЕ
        # сообщения. Конфиг канона краснил у собственного хука. Двоеточие после
        # слова из denylist'а (`secret`, `password`, `token`, `api_key`) внутри
        # этого entry запрещено; регрессия — `tests/test_payload_clean_for_scanners.py`.
        entry: |-
          bash -c 'cd "$(git rev-parse --show-toplevel)" || exit 1; t=""; for c in "${LINT_VENV:-backend/.venv}/bin/detect-secrets-hook" "${LINT_BE_DIR:-backend}/.venv/bin/detect-secrets-hook" ".venv/bin/detect-secrets-hook"; do [ -x "$c" ] && { t="$c"; break; }; done; [ -n "$t" ] || t="$(command -v detect-secrets-hook || true)"; if [ -n "$t" ]; then [ -f .secrets.baseline ] || { printf "\033[31msecrets — baseline отсутствует. Сними его (порядок §5 шага 11: сначала git add): detect-secrets scan \$(git ls-files -c -o --exclude-standard) > .secrets.baseline\033[0m\n"; exit 1; }; "$t" --baseline .secrets.baseline "$@" || exit 1; printf "secrets — просканировано %d файл(ов)\n" "$#"; else if grep -qsiE "security-oracles:.*weak" delivery/active/STATUS.md; then printf "\033[33m⚠ detect-secrets не установлен; security-oracles: weak объявлен в STATUS — бедность названа, не спрятана (§2.7)\033[0m\n"; else printf "\033[31msecrets — инструмента НЕТ, а weak НЕ объявлен — гейт не смеет молча выйти нулём (lab-11 F10). Выходы: pip install detect-secrets (он в requirements-dev.txt шага 4) ИЛИ объяви security-oracles: weak в delivery/active/STATUS.md\033[0m\n"; exit 1; fi; fi' --
        pass_filenames: true

      # ⚠ ЗАМЕР, а не мнение: `deps-audit` один даёт ~24 с (ходит в сеть за базой
      # уязвимостей), при бюджете pre-push ≤10 с (§8.6). Восьмое развёртывание
      # намерило 24.5 с против 0.04 с без него — то есть весь перебор бюджета давал
      # он. Хук, вылезший за бюджет, начинают обходить (`--no-verify`), и тогда не
      # работает ни он, ни соседи. Поэтому по умолчанию гейт **CI-only**: в
      # `quality.yml` он обязателен, а на pre-push включается строкой ниже — только
      # если проект замерил и уложился (кэш индекса, офлайн-база).
      #   stages: [pre-push]
      - id: deps-audit
        name: no new vulnerable dependencies (CI-only по бюджету §8.6)
        # LINT_FE_DIR=. обязателен: дефолт скрипта — `frontend`, и без него
        # `npm audit --prefix frontend` уходил в несуществующий каталог. В CI
        # переменная стоит в `env:` workflow, поэтому роль там работала, а
        # локальный хук смотрел в пустоту — доктор назвал это DEAD, как только
        # гейт научился печатать число (cqg@1.79). Седьмой рецидив класса
        # «заявление в карте ролей, шаблонный путь в конфиге».
        entry: bash -c 'cd "$(git rev-parse --show-toplevel)" && LINT_FE_DIR=. bash scripts/lint/check_deps_audit.sh'
        language: system
        stages: [manual]
        pass_filenames: false
        always_run: true

  # -------------------------------------------------------------------------
  # Оракул артефакта (§6.5a): судит СОБРАННЫЙ сайт, а не исходник.
  # -------------------------------------------------------------------------
  - repo: local
    hooks:
      - id: dist-oracle
        name: dist — состав, мета-слой и вес собранных страниц
        language: system
        # `manual`, как у deps-audit: хуку нужен свежий `dist/`, а pre-commit
        # сборку не делает. Настоящее место исполнения — CI, сразу после
        # `npm run build`. Здесь строка стоит, чтобы gate-coverage видел гейт
        # подключённым, а не считал его забытым скриптом.
        entry: bash -c 'cd "$(git rev-parse --show-toplevel)" && python3 scripts/lint/check_dist_oracle.py'
        stages: [manual]
        pass_filenames: false
        always_run: true

  # Мета-гейт — ПОСЛЕДНИМ. Проверяет, что все гейты выше вообще подключены:
  # забытый в этом файле скрипт молча не работает (§3, gate-coverage).
  - repo: local
    hooks:
      - id: gate-coverage
        name: every gate script is wired into pre-commit/CI
        entry: bash scripts/lint/check_gate_coverage.sh
        language: system
        pass_filenames: false
        always_run: true
