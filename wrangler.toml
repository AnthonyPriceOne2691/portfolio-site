# Развёртывание витрины на Cloudflare Workers (статические ассеты).
#
# ⚠ Этот файл ОБЯЗАТЕЛЕН, и его отсутствие — не мелочь: панель Cloudflare для
# нового проекта предлагает флоу Workers с командой `npx wrangler deploy`, а она
# читает конфиг ИЗ РЕПОЗИТОРИЯ. Без него сборка проходит, а деплой падает на
# «no config found» — то есть ошибка приезжает после зелёной сборки.
#
# Сайт статический: страницы обслуживаются ассетами напрямую, без выполнения JS
# на границе, — design §8.1 («статика целиком, SSR не берём»). Единственное
# исключение — видео (2026-10-02): статика на `Range` отвечает целым файлом (200),
# а Safari на iPhone и Mac видео без ответа 206 не играет. `worker/media.js` встаёт
# ТОЛЬКО перед `*.mp4` и вырезает запрошенный кусок; страниц он не касается.

name = "portfolio-site"          # обязан совпадать с именем проекта в панели
compatibility_date = "2026-09-21"
main = "worker/media.js"

[assets]
# Каталог сборки Astro. Build command на стороне Cloudflare — `npm run build:site`
# (именно он, а не `npm run build`: тот цепочкой зовёт `npm test`, а Playwright
# на сборщике нет).
directory = "./dist"

# ⚠ `404-page`, а не дефолт. Astro собирает страницу ошибки в `dist/404.html`,
# и без этой строки на несуществующем адресе отдавалась бы пустая страница
# Cloudflare вместо нашей — с навигацией и переключателем языка.
not_found_handling = "404-page"

# Воркер берёт файл из этой же статики и стоит только перед видео: остальное
# отдаётся ассетами раньше воркера, как без него.
binding = "ASSETS"
run_worker_first = ["/*.mp4"]
